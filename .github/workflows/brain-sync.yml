name: Brain sync

# Exports Brain entries tagged `public,site-project` / `public,site-now` into src/content and opens (or updates) one
# reviewable PR from the `brain-sync` branch. No diff → no PR (an open sync PR that became empty is closed).
# The export fails closed: a safety-lint finding fails this job before any file is written, so no PR is created.

on:
  schedule:
    - cron: '0 9 * * *' # nightly, 09:00 UTC
  workflow_dispatch:

permissions:
  contents: write # push the brain-sync branch
  pull-requests: write # open / update / close the sync PR
  actions: write # dispatch ci.yml on brain-sync (GITHUB_TOKEN pushes don't trigger workflows)

concurrency:
  group: brain-sync
  cancel-in-progress: false

env:
  SYNC_BRANCH: brain-sync
  PR_TITLE: 'Brain sync: projects & now'

jobs:
  sync:
    name: Export Brain → PR
    runs-on: [self-hosted, amos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Export from Brain (fails closed on the safety lint)
        env:
          BRAIN_URL: ${{ secrets.BRAIN_URL }}
          BRAIN_TOKEN: ${{ secrets.BRAIN_TOKEN }}
        run: npm run brain:export

      - name: Detect changes
        id: diff
        run: |
          set -euo pipefail
          paths="src/content"; [ -d src/assets ] && paths="$paths src/assets"
          git add -A -- $paths
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes from Brain."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Validate (tests, astro check, build, dist scan, link check)
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          npm test
          npm run check
          npm run build
          npm run verify:dist
          npm run check:links

      - name: Commit and push brain-sync
        id: push
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$SYNC_BRANCH"
          git commit -q -m "🤖 chore: Brain sync (projects & now)"
          {
            echo 'stat<<EOF'
            git diff --stat HEAD~1 HEAD
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # Skip the push when the open sync branch already has exactly this content (avoids nightly PR churn).
          if git fetch -q origin "$SYNC_BRANCH" 2>/dev/null && \
             [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "brain-sync already up to date."
          else
            git push -q --force origin "HEAD:refs/heads/$SYNC_BRANCH"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open, update, or close the sync PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CHANGED: ${{ steps.diff.outputs.changed }}
          PUSHED: ${{ steps.push.outputs.pushed }}
          STAT: ${{ steps.push.outputs.stat }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.SYNC_BRANCH;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const [open] = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', head: `${owner}:${branch}`, base: 'main',
            });

            if (process.env.CHANGED !== 'true') {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number,
                  body: `Brain now matches \`main\`; closing. (${runUrl})` });
                await github.rest.pulls.update({ owner, repo, pull_number: open.number, state: 'closed' });
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` }).catch(() => {});
                core.notice(`Closed #${open.number}: no diff against main`);
              } else {
                core.notice('No diff against main; no PR.');
              }
              return;
            }

            const body = [
              'Generated by the **Brain sync** workflow from Brain entries tagged `public,site-project` / `public,site-now`.',
              '',
              `- Run: ${runUrl}`,
              '- Validated in the sync job: `npm test`, `npm run check`, `npm run build`, `npm run verify:dist`, `npm run check:links`.',
              '- Pushes made with `GITHUB_TOKEN` do not trigger workflows, so the sync job dispatches `ci.yml` on this branch;',
              '  its checks (including the Docker build) appear on the head commit.',
              '- Review that every card reads as public-facing. To drop a card, remove the `public` tag in Brain and re-run the sync.',
              '',
              '```',
              (process.env.STAT || '').trim(),
              '```',
            ].join('\n');

            let number;
            if (open) {
              await github.rest.pulls.update({ owner, repo, pull_number: open.number, title: process.env.PR_TITLE, body });
              number = open.number;
            } else {
              const { data } = await github.rest.pulls.create({
                owner, repo, head: branch, base: 'main', title: process.env.PR_TITLE, body,
              });
              number = data.number;
            }
            core.notice(`Sync PR: ${context.serverUrl}/${owner}/${repo}/pull/${number}`);

            if (process.env.PUSHED === 'true') {
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'ci.yml', ref: branch });
            }
