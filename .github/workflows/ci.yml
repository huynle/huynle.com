name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch: # brain-sync.yml dispatches this on its branch (GITHUB_TOKEN pushes don't trigger push/PR events)

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Check, test, build, verify
    runs-on: [self-hosted, amos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: astro check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Scan dist for drafts and leaks
        run: npm run verify:dist
      - name: Internal link check
        run: npm run check:links

  image:
    name: Docker build (no push)
    runs-on: [self-hosted, amos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.11.1
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: huynle-site:ci
      - name: Smoke test container
        run: |
          set -euo pipefail
          cid=$(docker run -d -P huynle-site:ci)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          port=$(docker port "$cid" 8080/tcp | head -1 | sed 's/.*://')
          for i in $(seq 1 20); do curl -fsS "http://127.0.0.1:${port}/healthz" >/dev/null && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/healthz")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:${port}/index.xml")" = "301 http://127.0.0.1:${port}/rss.xml"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/nope")" = 404
          echo "container smoke test OK"
